<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0b111b;--panel:#141f2d;--line:#ffffff18;--muted:#93a1b4;--gold:#e8c77e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#344660 0,transparent 55%),var(--bg);color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;min-height:100vh;padding:34px 16px}.wrap{width:min(500px,100%);margin:auto}.back{color:#c8d6eb;text-decoration:none;font-size:12px;font-weight:750}.card{margin:24px auto;background:linear-gradient(145deg,#1b2a3d,#111a27 70%);border:1px solid #ffffff20;border-radius:28px;overflow:hidden;box-shadow:0 28px 80px #0008}.cover{height:178px;background:radial-gradient(circle at 80% 30%,#b68c4b55,transparent 24%),linear-gradient(115deg,#253c58,#111a28 60%,#4b3a25);position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,#141f2d)}.main{padding:0 34px 34px;position:relative}.avatar-wrap{margin-top:-66px;position:relative;width:132px;height:132px}.avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;background:#263b55;border:6px solid #172333;box-shadow:0 8px 30px #0008}.initial{position:absolute;inset:6px;display:grid;place-items:center;font-size:44px;font-weight:900;background:linear-gradient(145deg,#d9e8fa,#6483aa);color:#1a2b41;border-radius:50%}.edit{position:absolute;right:0;bottom:3px;border:2px solid #172333;background:#e5c77f;color:#30240f;border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-top:14px}.username{font-size:11px;color:#e8c77e;font-weight:850;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}.name{font-size:clamp(25px,5vw,38px);font-weight:900;letter-spacing:-1.3px;overflow-wrap:anywhere}.email{color:#aebbd0;font-size:12px;margin-top:5px;overflow-wrap:anywhere}.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.badge{border-radius:99px;padding:7px 11px;font-size:9px;letter-spacing:.1em;font-weight:950}.basic{background:#27364a;color:#dce6f3;border:1px solid #6e829b}.plus{background:linear-gradient(120deg,#64758c,#e2e9f2,#8799b0);color:#1d2b3c;border:1px solid #f0f5fc}.premium{background:linear-gradient(120deg,#fff0b8,#d3a44b,#fff1c7);color:#553a0b;border:1px solid #ffe9aa}.admin{background:linear-gradient(120deg,#1c2d42,#65788f,#d7c18f);color:#fff1c9;border:1px solid #e8d6a8;letter-spacing:.16em}.section{margin-top:25px;padding:21px;border:1px solid var(--line);border-radius:18px;background:#ffffff08}.section h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#d4dfef;margin:0 0 14px}.about{color:#c0ccdc;line-height:1.75;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px;border:1px solid var(--line);border-radius:14px;background:#ffffff08}.stat small{display:block;color:var(--muted);font-size:10px}.stat strong{display:block;font-size:24px;margin-top:6px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid var(--line);background:#ffffff10;color:#eaf0f8;padding:10px 14px;border-radius:10px;font-size:11px;font-weight:800;cursor:pointer}.btn.primary{background:#e5c77f;color:#30240f;border:0}.btn:disabled{opacity:.5}.edit-form{display:none;margin-top:18px;gap:10px}.edit-form.show{display:grid}.edit-form label{font-size:10px;color:#9fadc0}.edit-form textarea{width:100%;min-height:100px;background:#0e1723;color:white;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}.status{font-size:11px;color:#b5c3d6;margin-top:10px}.empty{color:#8f9db1;font-size:12px}@media(max-width:600px){body{padding:20px 10px}.main{padding:0 18px 22px}.cover{height:130px}.avatar-wrap,.avatar{width:112px;height:112px}.avatar-wrap{margin-top:-56px}.heading{display:block}.stats{grid-template-columns:repeat(2,1fr)}.stat:last-child{grid-column:1/-1}}
</style></head><body><main class="wrap"><a class="back" href="index.html">← Back to MoneyMap</a><article class="card"><div class="cover"></div><div class="main"><div class="avatar-wrap"><div class="initial" id="initial">M</div><img class="avatar" id="avatar" alt="Profile picture" hidden><button class="edit" id="editAvatar" aria-label="Change profile picture" hidden>✎</button></div><div class="heading"><div><div class="name" id="name">serifxvi</div><div class="username" id="username">@serifxvi</div><div class="email" id="email">Loading profile…</div><div class="badges" id="badges"></div></div></div><section class="section"><h2>About me</h2><div class="about" id="about">This member hasn't written an introduction yet.</div></section><section class="section"><h2>Game win streaks</h2><div class="stats"><div class="stat"><small>Trading · Current streak</small><strong id="current">—</strong></div><div class="stat"><small>Trading · Best streak</small><strong id="best">—</strong></div><div class="stat"><small>Trading · Profitable trades</small><strong id="wins">—</strong></div><div class="stat"><small>Money Quest · Daily streak</small><strong id="questStreak">—</strong></div></div><p class="empty" id="gameNote">Practice simulator records are shown when available.</p></section><div class="actions"><button class="btn primary" id="editProfile" hidden>Edit profile</button><button class="btn" id="shareProfile">Copy profile link</button></div><div class="edit-form" id="editor"><label for="aboutInput">About me</label><textarea id="aboutInput" maxlength="500" placeholder="Tell the MoneyMap community a little about yourself…"></textarea><button class="btn primary" id="saveProfile">Save changes</button></div><div class="status" id="status" role="status"></div><input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp" hidden></div></article></main>
<script>
(()=>{'use strict';
const S={url:'https://dmapwfwltcfsmqgrvrxq.supabase.co',key:'sb_publishable_oTsRscLiwa-XrbQtqIC9EA_q9ruORzZ'},SESSION='moneymap_supabase_session_v1',TIER='moneymap_selected_tier_v1',GAME='moneymap_trading_practice_v1',TABLE='/rest/v1/moneymap_member_profiles';
const $=id=>document.getElementById(id);let session=null,own=false,profile=null;
try{session=JSON.parse(localStorage.getItem(SESSION)||'null')}catch{}
const token=async()=>{if(!session?.access_token)throw Error('Sign in to edit your profile.');if(session.expires_at&&session.expires_at<Date.now()/1000+60&&session.refresh_token){const r=await fetch(S.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:S.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});const d=await r.json();if(!r.ok)throw Error(d.msg||'Session expired. Sign in again.');session={...session,...d,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600)};localStorage.setItem(SESSION,JSON.stringify(session));}return session.access_token};
async function req(path,opts={},jwt){const h={apikey:S.key,Accept:'application/json',...(opts.headers||{})};if(jwt)h.Authorization='Bearer '+jwt;if(opts.body)h['Content-Type']='application/json';const r=await fetch(S.url+path,{...opts,headers:h});const raw=await r.text();let d;try{d=raw?JSON.parse(raw):null}catch{d=raw}if(!r.ok)throw Error(d?.message||d?.msg||String(d||'Request failed'));return d}
function tier(){try{const x=localStorage.getItem(TIER);return ['basic','plus','premium'].includes(x)?x:'basic'}catch{return 'basic'}}
function paintBadge(t,admin){const b=document.createElement('span');b.className='badge '+(admin?'admin':t==='premium'?'premium':t==='plus'?'plus':'basic');b.textContent=admin?'✦ FOUNDER · ADMIN':t==='premium'?'✦ PREMIUM':t==='plus'?'◇ PLUS · SILVER CRYSTAL':'◇ BASIC MEMBER';$('badges').append(b)}
function avatar(url,email){$('initial').textContent=(email||'M').slice(0,1).toUpperCase();if(url){$('avatar').src=url;$('avatar').hidden=false;$('initial').hidden=true}else{$('avatar').hidden=true;$('initial').hidden=false}}
function showGame(g){g=g||{};$('current').textContent=Number(g.streak)||0;$('best').textContent=Number(g.best)||0;$('wins').textContent=Number(g.wins)||0;$('questStreak').textContent=Number(g.questStreak)||0}
function localGame(){let g={};try{g=JSON.parse(localStorage.getItem(GAME)||'{}')}catch{}try{const q=JSON.parse(localStorage.getItem('moneymap_money_quest_v1')||'{}');g.questStreak=Number(q.streak)||0}catch{}return g}
async function load(){
 const id=new URLSearchParams(location.search).get('id')||session?.user?.id;
 if(!id){$('email').textContent='Sign in to view your own profile.';$('status').textContent='No profile selected.';return}
 own=!!session?.user?.id&&session.user.id===id;
 $('editProfile').hidden=!own;$('editAvatar').hidden=!own;
 try{
  const rows=await req(TABLE+'?select=user_id,email,username,about,avatar_url,plan_tier,game_stats,badges,created_at&user_id=eq.'+encodeURIComponent(id)+'&limit=1');
  profile=rows?.[0]||null;
  if(!profile&&own){const g=localGame();const payload={user_id:id,username:session.user.email?.toLowerCase()===OWNER?'serifxvi':(session.user.email||'member').split('@')[0],about:'',plan_tier:tier(),game_stats:{streak:g.streak||0,best:g.best||0,wins:g.wins||0,questStreak:g.questStreak||0},badges:[]};await req(TABLE,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(payload)},await token());const again=await req(TABLE+'?select=user_id,email,username,about,avatar_url,plan_tier,game_stats,badges&user_id=eq.'+encodeURIComponent(id));profile=again?.[0]||payload;}
  if(!profile)throw Error('Profile not found. Ask the member to open their profile once from their MoneyMap account.');
  const username=String(profile.username||(String(profile.email||'member').split('@')[0]));$('name').textContent=username;$('username').textContent='@'+username;
  $('email').textContent=profile.email||'Email not available';
  $('about').textContent=profile.about||'This member hasn’t written an introduction yet.';
  avatar(profile.avatar_url,profile.email);showGame(profile.game_stats);
  paintBadge(profile.plan_tier||'basic',false);
  (Array.isArray(profile.badges)?profile.badges:[]).forEach(b=>{const el=document.createElement('span');el.className='badge basic';el.textContent=b; $('badges').append(el)});
  if(own){const g=localGame();showGame(g);$('aboutInput').value=profile.about||'';await syncStats(g);}
 }catch(e){$('status').textContent=e.message;$('email').textContent=own?(session?.user?.email||'Your account'):'MoneyMap member'}
}
async function syncStats(g){try{await req(TABLE+'?user_id=eq.'+encodeURIComponent(session.user.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({plan_tier:tier(),game_stats:{streak:g.streak||0,best:g.best||0,wins:g.wins||0},updated_at:new Date().toISOString()})},await token())}catch(e){$('gameNote').textContent='Could not sync game records yet: '+e.message}}
$('editProfile').addEventListener('click',()=>$('editor').classList.toggle('show'));
$('saveProfile').addEventListener('click',async()=>{try{$('saveProfile').disabled=true;const about=$('aboutInput').value.trim(),username=session.user.email?.toLowerCase()===OWNER?'serifxvi':(profile?.username||session.user.email.split('@')[0]);await req(TABLE,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:session.user.id,username,about,plan_tier:tier()})},await token());profile={...profile,username,about};$('name').textContent=username;$('username').textContent='@'+username;$('about').textContent=about||'This member hasn’t written an introduction yet.';$('editor').classList.remove('show');$('status').textContent='Profile updated successfully.'}catch(e){$('status').textContent='Could not save profile: '+e.message}finally{$('saveProfile').disabled=false}});
$('editAvatar').addEventListener('click',()=>$('avatarFile').click());
$('avatarFile').addEventListener('change',async()=>{const file=$('avatarFile').files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){ $('status').textContent='Please choose a JPG, PNG or WebP image.';return}if(file.size>5*1048576){$('status').textContent='Choose an image under 5 MB.';return}try{$('editAvatar').disabled=true;$('status').textContent='Uploading profile picture…';const jwt=await token(),ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg',path=session.user.id+'/profile/avatar-'+Date.now()+'.'+ext;const r=await fetch(S.url+'/storage/v1/object/community-media/'+path,{method:'POST',headers:{apikey:S.key,Authorization:'Bearer '+jwt,'Content-Type':file.type},body:file});if(!r.ok)throw Error(await r.text());const url=S.url+'/storage/v1/object/public/community-media/'+path;await req(TABLE,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:session.user.id,username:session.user.email?.toLowerCase()===OWNER?'serifxvi':session.user.email.split('@')[0],avatar_url:url,plan_tier:tier()})},jwt);profile={...profile,avatar_url:url};avatar(url,session.user.email);$('status').textContent='Profile photo uploaded successfully.'}catch(e){$('status').textContent='Photo upload failed: '+e.message}finally{$('editAvatar').disabled=false;$('avatarFile').value=''}});
$('shareProfile').addEventListener('click',async()=>{const url=location.origin+location.pathname+'?id='+(new URLSearchParams(location.search).get('id')||session?.user?.id||'');try{await navigator.clipboard.writeText(url);$('status').textContent='Profile link copied.'}catch{$('status').textContent=url}});
load();
})();
</script></body></html>
